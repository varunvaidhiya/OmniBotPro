<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none" font-family="system-ui, sans-serif">
  <rect width="800" height="420" rx="16" fill="#0a0e1a"/>
  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">OhhO OS v1.0.0 — Feature Map</text>
  <!-- Column 1: Control -->
  <rect x="30" y="60" width="240" height="340" rx="12" fill="#0d1424" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="150" y="88" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="700" letter-spacing="1">CONTROL</text>
  <circle cx="150" cy="110" r="3" fill="#00d4ff"/>
  <text x="165" y="114" fill="#e2e8f0" font-size="12">Robot Abstraction Layer</text>
  <circle cx="150" cy="130" r="3" fill="#00d4ff"/>
  <text x="165" y="134" fill="#e2e8f0" font-size="12">5 adapters: sim · serial · arm</text>
  <circle cx="150" cy="150" r="3" fill="#00d4ff"/>
  <text x="165" y="154" fill="#e2e8f0" font-size="12">CompositeTransport (base+arm)</text>
  <circle cx="150" cy="170" r="3" fill="#00d4ff"/>
  <text x="165" y="174" fill="#e2e8f0" font-size="12">Capability-gated commands</text>
  <circle cx="150" cy="190" r="3" fill="#00d4ff"/>
  <text x="165" y="194" fill="#e2e8f0" font-size="12">2 runtimes: native + ROS 2</text>
  <circle cx="150" cy="210" r="3" fill="#00d4ff"/>
  <text x="165" y="214" fill="#e2e8f0" font-size="12">Auto-detect: get_runtime("auto")</text>
  <circle cx="150" cy="230" r="3" fill="#00d4ff"/>
  <text x="165" y="234" fill="#e2e8f0" font-size="12">ros2:// transport bridges topics</text>
  <circle cx="150" cy="250" r="3" fill="#00d4ff"/>
  <text x="165" y="254" fill="#e2e8f0" font-size="12">3 built-in robots + manifests</text>
  <circle cx="150" cy="270" r="3" fill="#00d4ff"/>
  <text x="165" y="274" fill="#e2e8f0" font-size="12">Emergency stop + safety</text>
  <!-- Column 2: Intelligence -->
  <rect x="280" y="60" width="240" height="340" rx="12" fill="#0d1424" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="400" y="88" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700" letter-spacing="1">INTELLIGENCE</text>
  <circle cx="400" cy="110" r="3" fill="#a78bfa"/>
  <text x="415" y="114" fill="#e2e8f0" font-size="12">Agent: perceive→reason→act→reflect</text>
  <circle cx="400" cy="130" r="3" fill="#a78bfa"/>
  <text x="415" y="134" fill="#e2e8f0" font-size="12">LLM tool-calling reasoner</text>
  <circle cx="400" cy="150" r="3" fill="#a78bfa"/>
  <text x="415" y="154" fill="#e2e8f0" font-size="12">ToolRegistry from capabilities</text>
  <circle cx="400" cy="170" r="3" fill="#a78bfa"/>
  <text x="415" y="174" fill="#e2e8f0" font-size="12">ScriptedBrain fallback (no deps)</text>
  <circle cx="400" cy="190" r="3" fill="#a78bfa"/>
  <text x="415" y="194" fill="#e2e8f0" font-size="12">Recorder → LeRobot v2.0 datasets</text>
  <circle cx="400" cy="210" r="3" fill="#a78bfa"/>
  <text x="415" y="214" fill="#e2e8f0" font-size="12">finetune(): smolvla/act/diffusion</text>
  <circle cx="400" cy="230" r="3" fill="#a78bfa"/>
  <text x="415" y="234" fill="#e2e8f0" font-size="12">FastAPI serve: /predict endpoint</text>
  <circle cx="400" cy="250" r="3" fill="#a78bfa"/>
  <text x="415" y="254" fill="#e2e8f0" font-size="12">device="auto" (cuda/mps/cpu)</text>
  <circle cx="400" cy="270" r="3" fill="#a78bfa"/>
  <text x="415" y="274" fill="#e2e8f0" font-size="12">Mock mode for sim loops</text>
  <!-- Column 3: Platform -->
  <rect x="530" y="60" width="240" height="340" rx="12" fill="#0d1424" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="650" y="88" text-anchor="middle" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="1">PLATFORM</text>
  <circle cx="650" cy="110" r="3" fill="#fbbf24"/>
  <text x="665" y="114" fill="#e2e8f0" font-size="12">CLI: 10 commands</text>
  <circle cx="650" cy="130" r="3" fill="#fbbf24"/>
  <text x="665" y="134" fill="#e2e8f0" font-size="12">ohho doctor / list / connect</text>
  <circle cx="650" cy="150" r="3" fill="#fbbf24"/>
  <text x="665" y="154" fill="#e2e8f0" font-size="12">ohho sim / drive / agent</text>
  <circle cx="650" cy="170" r="3" fill="#fbbf24"/>
  <text x="665" y="174" fill="#e2e8f0" font-size="12">ohho serve / market / profile</text>
  <circle cx="650" cy="190" r="3" fill="#fbbf24"/>
  <text x="665" y="194" fill="#e2e8f0" font-size="12">Skill market: @skill decorator</text>
  <circle cx="650" cy="210" r="3" fill="#fbbf24"/>
  <text x="665" y="214" fill="#e2e8f0" font-size="12">4 built-in skills (patrol, wave...)</text>
  <circle cx="650" cy="230" r="3" fill="#fbbf24"/>
  <text x="665" y="234" fill="#e2e8f0" font-size="12">5 hardware profiles</text>
  <circle cx="650" cy="250" r="3" fill="#fbbf24"/>
  <text x="665" y="254" fill="#e2e8f0" font-size="12">detect_profile() auto-detect</text>
  <circle cx="650" cy="270" r="3" fill="#fbbf24"/>
  <text x="665" y="274" fill="#e2e8f0" font-size="12">Apache-2.0 · 151 tests · CONTRIBUTING</text>
  <!-- Stats bar -->
  <rect x="30" y="365" width="740" height="30" rx="6" fill="#0a0e1a" stroke="#1e2a44"/>
  <text x="115" y="385" text-anchor="middle" fill="#00d4ff" font-size="12" font-weight="600">6 adapters</text>
  <text x="280" y="385" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">4 VLA policies</text>
  <text x="445" y="385" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">10 CLI commands</text>
  <text x="610" y="385" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">151 tests passing</text>
</svg>
