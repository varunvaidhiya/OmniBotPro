program: lerobot_engine/train.py
method: bayes
metric:
  name: eval/loss
  goal: minimize
early_terminate:
  type: hyperband
  min_iter: 10
  eta: 2
parameters:
  lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  batch_size:
    values: [4, 8, 16]
  chunk_size:
    values: [20, 50, 100]
  grad_clip_norm:
    values: [1.0, 5.0, 10.0]
  num_epochs:
    value: 50
  model:
    value: smolvla
  checkpoint:
    value: lerobot/smolvla_base
  wandb_project:
    value: omnibot_smolvla
