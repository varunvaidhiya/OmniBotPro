bev_stitcher:
  ros__parameters:
    # Camera names — one topic subscription is created per name
    camera_names: ['front', 'rear', 'left', 'right']

    # Topic pattern — {name} is replaced with each camera name
    input_topic_pattern: '/camera/{name}/image_raw'

    # Output topic for the stitched BEV image
    output_topic: '/camera/bev/image_raw'

    # TF frame id written into the published image header
    output_frame_id: 'bev_frame'

    # Source (input) image dimensions — cameras are resized to this before warping
    src_width: 640
    src_height: 480

    # Internal compositing canvas size (square)
    canvas_size: 800

    # Final published image dimensions (can differ from canvas_size)
    output_width: 800
    output_height: 800

    # Publish rate
    publish_hz: 30.0

    # ── Calibration ───────────────────────────────────────────────────────────
    #
    # calibration_mode: 'checkerboard' | 'ipm' | 'auto'
    #   - checkerboard: load homographies from calibration_file .npz
    #   - ipm:          compute homographies geometrically from camera poses
    #   - auto:         try IPM first, fall back to .npz, then tiled grid
    calibration_mode: 'auto'

    # Path to calibration file generated by bev_calibrate, bev_ipm, or bev_cal_ui
    # If file not found (and no IPM params), falls back to tiled layout
    calibration_file: ~/bev_calibration.npz

    # ── IPM (Inverse Perspective Mapping) parameters ─────────────────────────
    #
    # Used when calibration_mode is 'ipm' or 'auto'.
    # Camera poses are in base_link frame: X forward, Y left, Z up.
    # Orientation: [yaw, pitch, roll] — see docs for camera_rotation().
    pixels_per_meter: 80.0
    ground_z: 0.0

    # ── TF2 auto-discovery ───────────────────────────────────────────────────
    #
    # When use_tf is true (default), the node looks up each camera's transform
    # from base_frame on startup.  Overrides the per-camera .position and
    # .orientation_rpy params when found.
    use_tf: true
    base_frame: 'base_link'
    # TF frame name pattern — {name} is replaced with camera name.
    tf_frame_pattern: '{name}_camera_optical_frame'

    # ── Camera info auto-discovery ───────────────────────────────────────────
    #
    # When use_camera_info is true, the node subscribes to per-camera
    # CameraInfo topics and extracts the intrinsic matrix K.  Overrides the
    # per-camera .fx/.fy/.cx/.cy params when received.
    use_camera_info: true
    camera_info_pattern: '/camera/{name}/camera_info'

    # Per-camera extrinsics (position [x,y,z] and orientation_rpy [yaw,pitch,roll])
    # and intrinsics (fx, fy, cx, cy).
    #
    # Orientation order: [yaw, pitch, roll] in radians.
    #   yaw:   horizontal look direction (0 = +X forward, π/2 = +Y left)
    #   pitch: vertical tilt (0 = horizontal, >0 = looking down)
    #   roll:  twist about optical axis (0 = camera right is horizontal)
    #
    # Defaults are sensible for a ~50 cm square robot with cameras at the
    # perimeter, angled slightly downward.  Tune these interactively with
    # `ros2 run ros2_bev_stitcher bev_cal_ui`.
    #
    # front:
    #   position: [0.24, 0.0, 0.12]
    #   orientation_rpy: [0.0, 0.35, 0.0]
    #   fx: 320.0
    #   fy: 320.0
    #   cx: 320.0
    #   cy: 240.0
    # rear:
    #   position: [-0.24, 0.0, 0.12]
    #   orientation_rpy: [3.1416, 0.35, 0.0]
    #   fx: 320.0
    #   fy: 320.0
    #   cx: 320.0
    #   cy: 240.0
    # left:
    #   position: [0.0, 0.17, 0.12]
    #   orientation_rpy: [1.5708, 0.35, 0.0]
    #   fx: 320.0
    #   fy: 320.0
    #   cx: 320.0
    #   cy: 240.0
    # right:
    #   position: [0.0, -0.17, 0.12]
    #   orientation_rpy: [-1.5708, 0.35, 0.0]
    #   fx: 320.0
    #   fy: 320.0
    #   cx: 320.0
    #   cy: 240.0

    # ── Diagnostics ───────────────────────────────────────────────────────────
    publish_diagnostics: false
