[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mecanum_drive_ros2"
version = "0.1.0"
description = "Hardware-agnostic mecanum wheel kinematics"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["mecanum_drive_ros2*"]
