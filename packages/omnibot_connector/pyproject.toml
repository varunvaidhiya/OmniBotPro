[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnibot-connector"
version = "0.1.0"
description = "Robot connector: MCP + REST bridge between OmniBot and AI agents (OpenClaw, Hermes)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "numpy<2.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "requests>=2.31.0",
    "prometheus-fastapi-instrumentator>=6.1",
    "prometheus_client>=0.20",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
voice = [
    "openwakeword>=0.6",
    "faster-whisper>=1.0",
    "sounddevice>=0.4",
    "numpy<2.0",
]

[project.scripts]
omnibot-connector = "omnibot_connector.server:main"
omnibot-connector-mcp = "omnibot_connector.mcp_server:main"
omnibot-connector-stream = "omnibot_connector.streaming.ws_server:main"
omnibot-connector-voice = "omnibot_connector.voice.pipeline:main"

[project.urls]
Homepage = "https://github.com/varunvaidhiya/Mecanum-Wheel-Robot"
Repository = "https://github.com/varunvaidhiya/Mecanum-Wheel-Robot"

[tool.setuptools.packages.find]
where = ["."]
include = ["omnibot_connector*"]
