route:
  group_by: [alertname, component]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: default_receiver

  routes:
    - match:
        severity: critical
      receiver: critical_receiver
      group_wait: 0s
      repeat_interval: 5m

    - match:
        component: safety
      receiver: critical_receiver
      group_wait: 0s
      repeat_interval: 5m

receivers:
  - name: default_receiver
    # Default: log all alerts to stdout (visible via docker logs).
    # Set ALERTMANAGER_EMAIL_TO / ALERTMANAGER_SLACK_URL env vars to
    # enable real notifications.

    # Email
    # email_configs:
    #   - to: '{{ .ExternalURL }}'
    #     send_resolved: true
    #     subject: '[OmniBot] {{ .GroupLabels.alertname }}'
    #     body: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

    # Slack
    # slack_configs:
    #   - api_url: '{{ .ExternalURL }}'
    #     channel: '#omnibot-alerts'
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ "\n" }}{{ end }}'

  - name: critical_receiver
    # email_configs:
    #   - to: '{{ .ExternalURL }}'
    #     send_resolved: true
    #     subject: '[OmniBot CRITICAL] {{ .GroupLabels.alertname }}'
    #     body: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, component]
