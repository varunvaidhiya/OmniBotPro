ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /odom
    # Wheel odometry: fuse VELOCITIES ONLY (vx, vy, vyaw).
    # Mecanum wheels slip — integrated absolute x/y/yaw from encoders drifts,
    # and feeding it as an absolute measurement fights the IMU. z/vz are
    # meaningless on a planar robot.
    # (Matrix rows: x y z | roll pitch yaw | vx vy vz | vr vp vyaw | ax ay az)
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    imu0: /imu/data
    # IMU: differential orientation (gyro-integrated yaw drifts — use as a
    # smoothed rate) + raw angular velocity. Linear accelerations DISABLED:
    # the Yahboom MEMS accelerometer is noisy and in two_d_mode the EKF
    # integrates ax/ay straight into velocity → estimate drift.
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_differential: true
    imu0_relative: true
    use_control: false
    print_diagnostics: true
    debug: false
    debug_out_file: /tmp/robot_localization_debug.txt
