name: ROS 2 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Check formatting
        run: ruff format --check --exclude robot_ws/src/omnibot_firmware .

      - name: Check linting
        run: ruff check --exclude robot_ws/src/omnibot_firmware .

      - name: Type check (mypy)
        run: |
          mypy packages/yahboom_ros2/yahboom_ros2/protocol.py \
               packages/mecanum_drive_ros2/mecanum_drive_ros2/ \
               --ignore-missing-imports

  build_and_test:
    name: Build & Test (Jazzy)
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Checkout serial-ros2
        run: |
          git clone https://github.com/RoverRobotics-forks/serial-ros2.git robot_ws/src/serial

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pip

      - name: Install Python test dependencies
        run: |
          pip3 install "numpy<2.0" \
                       pytest pytest-cov pytest-timeout coverage \
                       prometheus_client>=0.20 \
                       --break-system-packages

      - name: Update rosdep
        run: rosdep update

      - name: Install ROS dependencies
        run: |
          # Skip simulation/visualization packages that need extra apt repos
          # (ros_gz_* requires OSRF Gazebo repo) or are runtime-only deps not
          # needed for the build or unit tests.
          # ament_pep8 was removed from ROS 2 Jazzy (not in jazzy/distribution.yaml).
          # NOTE: --skip-keys takes separate arguments, not a quoted string.
          rosdep install --from-paths robot_ws/src --ignore-src -y --rosdistro jazzy \
            --skip-keys ros_gz_sim ros_gz_bridge foxglove_bridge rosbridge_server \
              depthimage_to_laserscan rtabmap_ros octomap_server pcl_ros octomap_msgs \
              ament_pep8

      - name: Build Workspace
        working-directory: robot_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Run ROS Tests
        working-directory: robot_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test

      - name: Verify Test Results
        working-directory: robot_ws
        run: |
          colcon test-result --verbose

      - name: Run Python Package Tests with Coverage
        run: |
          pip3 install -e packages/yahboom_ros2 -e packages/vla_serve \
                       -e packages/robot_episode_dataset \
                       -e packages/mecanum_drive_ros2 --break-system-packages
          # Enforce 60% threshold on tested packages only.
          # ros2_bev_stitcher and robot_episode_dataset have no unit tests yet
          # (they require ROS or large deps) — include them in the XML for
          # visibility but gate only on the three packages that have test suites.
          pytest packages/ \
                 --cov=packages/yahboom_ros2 \
                 --cov=packages/vla_serve \
                 --cov=packages/mecanum_drive_ros2 \
                 --cov-report=xml:coverage-packages.xml --cov-report=term-missing \
                 --cov-fail-under=60 \
                 -v
          # Run vla_engine and data_engine tests for sanity (no threshold).
          pytest vla_engine/tests/ data_engine/tests/ \
                 --cov=vla_engine --cov=data_engine \
                 --cov-report=xml:coverage-extra.xml --cov-report=term-missing \
                 -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage-packages.xml,./coverage-extra.xml
          fail_ci_if_error: false

      - name: Benchmark smoke test (pure-Python, <30s)
        run: |
          # Fast sanity pass — catches import errors and obvious regressions.
          # Full benchmarks run on the weekly schedule in benchmarks.yml.
          pip3 install -e packages/yahboom_ros2 \
                       -e packages/mecanum_drive_ros2 --break-system-packages
          python3 -m pytest \
            benchmarks/serial/bench_yahboom_protocol.py \
            benchmarks/kinematics/bench_mecanum_kinematics.py \
            -v --tb=short \
            -m "not hardware and not ros and not gpu" \
            -k "not sleep_overhead and not numpy_batch and not atan2" \
            --timeout=30

  vla_serve_test:
    name: vla_serve Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vla_serve
        run: |
          pip install -e packages/vla_serve httpx pytest pytest-cov \
                      prometheus-fastapi-instrumentator prometheus_client

      - name: Run vla_serve tests
        run: |
          pytest packages/vla_serve/ -v \
                 --cov=packages/vla_serve \
                 --cov-report=term-missing \
                 --cov-fail-under=60
