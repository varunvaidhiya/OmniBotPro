name: ROS 2 CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'infra/content/**'
      - 'digital_twin/configs/**'
      - 'android_app/**'
      - '**.md'
      - 'network.env'
      - 'deployment.env.example'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'infra/content/**'
      - 'digital_twin/configs/**'
      - 'android_app/**'
      - '**.md'
      - 'network.env'
      - 'deployment.env.example'

permissions:
  contents: read
  issues: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff mypy

      - name: Check formatting
        run: ruff format --check --exclude robot_ws/src/omnibot_firmware .

      - name: Check linting
        run: ruff check --exclude robot_ws/src/omnibot_firmware .

      - name: Type check (mypy)
        run: |
          mypy packages/yahboom_ros2/yahboom_ros2/protocol.py \
               packages/mecanum_drive_ros2/mecanum_drive_ros2/ \
               --ignore-missing-imports

  build_and_test:
    name: Build & Test (Jazzy)
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Checkout serial-ros2
        run: |
          git clone https://github.com/RoverRobotics-forks/serial-ros2.git robot_ws/src/serial

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pip

      - name: Install Python test dependencies
        run: |
          pip3 install "numpy<2.0" \
                       pytest pytest-cov pytest-timeout coverage \
                       prometheus_client>=0.20 \
                       httpx \
                       --break-system-packages

      - name: Install ROS dependencies
        run: |
          # Replace rosdep with an explicit apt-get install of exactly what
          # colcon build and test need.  rosdep was failing because:
          #   - 'serial' has no rosdep key (source-only package); --ignore-src
          #     should handle it but is unreliable in CI environments.
          #   - 'boost' maps to libboost-all-dev (~1.5 GB meta-package) which
          #     can exhaust disk space or hit apt conflicts.
          # Only packages not already provided by ros-jazzy-ros-base are listed.
          sudo apt-get install -y \
            ros-jazzy-cv-bridge \
            ros-jazzy-tf-transformations \
            ros-jazzy-tf2-ros \
            ros-jazzy-tf2-geometry-msgs \
            ros-jazzy-nav2-msgs \
            ros-jazzy-xacro \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-joint-state-publisher \
            ros-jazzy-joy \
            ros-jazzy-teleop-twist-joy \
            ros-jazzy-ament-cmake-pytest \
            ros-jazzy-ament-copyright \
            ros-jazzy-ament-lint-auto \
            ros-jazzy-ament-lint-common \
            ros-jazzy-diagnostic-msgs \
            ros-jazzy-sensor-msgs \
            ros-jazzy-nav-msgs \
            ros-jazzy-geometry-msgs \
            ros-jazzy-std-msgs \
            python3-serial \
            python3-aiohttp \
            python3-transforms3d \
            libboost-dev

      - name: Build Workspace
        working-directory: robot_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install

      - name: Run ROS Tests
        working-directory: robot_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon test

      - name: Verify Test Results
        working-directory: robot_ws
        run: |
          colcon test-result --verbose

      - name: Create Issue with Test Results
        if: failure()
        working-directory: robot_ws
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          colcon test-result --verbose > test_failures.txt || true
          # Only create an issue if the file isn't empty
          if [ -s test_failures.txt ]; then
            gh issue create --title "CI Test Failures $GITHUB_SHA" --body-file test_failures.txt
          fi

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-test-logs
          path: robot_ws/log/

      - name: Run Python Package Tests with Coverage
        run: |
          pip3 install -e packages/yahboom_ros2 -e packages/vla_serve \
                       -e packages/robot_episode_dataset \
                       -e packages/mecanum_drive_ros2 \
                       -e packages/competitive_advantage --break-system-packages
          # Enforce 60% threshold on tested packages only.
          # ros2_bev_stitcher and robot_episode_dataset have no unit tests yet
          # (they require ROS or large deps) — include them in the XML for
          # visibility but gate only on the three packages that have test suites.
          pytest packages/ \
                 --cov=packages/yahboom_ros2 \
                 --cov=packages/vla_serve \
                 --cov=packages/mecanum_drive_ros2 \
                 --cov-report=xml:coverage-packages.xml --cov-report=term-missing \
                 --cov-fail-under=60 \
                 -v
          # Run vla_engine and data_engine tests for sanity (no threshold).
          pytest vla_engine/tests/ data_engine/tests/ \
                 --cov=vla_engine --cov=data_engine \
                 --cov-report=xml:coverage-extra.xml --cov-report=term-missing \
                 -v

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          files: ./coverage-packages.xml,./coverage-extra.xml
          fail_ci_if_error: false

      - name: Benchmark smoke test (pure-Python, <30s)
        run: |
          # Fast sanity pass — catches import errors and obvious regressions.
          # Full benchmarks run on the weekly schedule in benchmarks.yml.
          pip3 install -e packages/yahboom_ros2 \
                       -e packages/mecanum_drive_ros2 --break-system-packages
          python3 -m pytest \
            benchmarks/serial/bench_yahboom_protocol.py \
            benchmarks/kinematics/bench_mecanum_kinematics.py \
            -v --tb=short \
            -m "not hardware and not ros and not gpu" \
            -k "not sleep_overhead and not numpy_batch and not atan2" \
            --timeout=30

  vla_serve_test:
    name: vla_serve Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install vla_serve
        run: |
          pip install -e packages/vla_serve httpx pytest pytest-cov \
                      prometheus-fastapi-instrumentator prometheus_client

      - name: Run vla_serve tests
        run: |
          pytest packages/vla_serve/ -v \
                 --cov=packages/vla_serve \
                 --cov-report=term-missing \
                 --cov-fail-under=60
