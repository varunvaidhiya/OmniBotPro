program: rl_engine/scripts/train_nav.py
method: bayes
metric:
  name: Train/mean_reward
  goal: maximize
early_terminate:
  type: hyperband
  min_iter: 200
  eta: 3
parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-3
  clip_param:
    values: [0.1, 0.2, 0.3]
  entropy_coef:
    distribution: log_uniform_values
    min: 1e-4
    max: 1e-2
  num_learning_epochs:
    values: [4, 6, 8]
  num_mini_batches:
    values: [4, 8]
  gamma:
    values: [0.97, 0.98, 0.99]
  lam:
    values: [0.90, 0.95, 0.97]
  value_loss_coef:
    distribution: uniform
    min: 0.5
    max: 2.0
  desired_kl:
    values: [0.005, 0.01, 0.016]
  num_envs:
    value: 512
  max_iterations:
    value: 1000
  wandb_project:
    value: omnibot_nav
